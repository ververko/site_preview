<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing — Vera Korman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12182B;
    --navy-soft:#4A5570;
    --white:#FFFFFF;
    --pink:#FF3D7F;
    --cobalt:#3654FF;
    --green:#1FAE6E;
    --violet:#8B5CF6;
    --serif:'Bricolage Grotesque', 'Work Sans', sans-serif;
    --sans:'Work Sans', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--sans); color:var(--navy); background:var(--white); font-weight:400; line-height:1.6;}
  img{display:block; width:100%; height:auto; object-fit:cover; border-radius:10px;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 24px;}
  h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:-.01em; line-height:1.1;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-family:var(--sans); font-weight:700;
    font-size:14px; letter-spacing:.02em; padding:17px 32px; border-radius:999px;
    transition:transform .16s ease; border:2px solid transparent; color:var(--white); background:var(--navy);
  }
  .btn:hover{transform:translateY(-2px);}

  header{background:var(--navy); position:sticky; top:0; z-index:50;}
  nav{max-width:1200px; margin:0 auto; padding:22px 48px; display:flex; align-items:center; justify-content:flex-end;}
  .navlinks{display:flex; align-items:center; gap:36px; font-size:14px; font-weight:500; color:var(--white);}
  .navlinks a:hover{color:var(--pink);}
  .navlinks .btn{background:var(--pink); padding:11px 24px; font-size:13px;}

  .page-head{padding:90px 0 60px 0;}
  .page-head .kicker{
    display:inline-block; font-size:14px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--pink); margin-bottom:14px;
  }
  .page-head h1{font-size:56px; color:var(--navy); margin-bottom:16px;}
  .page-head p{font-size:18px; color:var(--navy-soft); max-width:480px;}

  .feed{padding-bottom:120px;}
  .post{padding:52px 0; border-top:1px solid #E7E9F0;}
  .post:first-child{border-top:1px solid #E7E9F0;}
  .post-date{
    font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--navy-soft); margin-bottom:10px; display:block;
  }
  .post h2{font-size:30px; color:var(--navy); margin-bottom:18px;}
  .post img{margin-bottom:22px;}
  .post-body{font-size:18px; color:var(--navy-soft); max-width:640px;}
  .post-body p{margin-bottom:16px;}
  .post-body p:last-child{margin-bottom:0;}
  .post-body code{
    background:#F1F2F7; padding:2px 6px; border-radius:4px; font-size:15px; color:var(--navy);
  }

  .empty{padding:60px 0; color:var(--navy-soft); font-size:16px;}

  footer{background:var(--navy); color:#B7BFD6; padding:50px 0; font-size:14px; text-align:center;}
  footer a:hover{color:var(--pink);}

  @media (max-width:640px){
    nav{padding:20px 24px;}
    .navlinks{gap:18px; font-size:13px;}
    .page-head{padding:56px 0 40px 0;}
    .page-head h1{font-size:38px;}
    .post h2{font-size:24px;}
    .post-body{font-size:16px;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="navlinks">
      <a href="index.html#about">About</a>
      <a href="index.html#programs">Programs</a>
      <a href="index.html#highlights">Selected Work</a>
      <a href="writing.html">Writing</a>
      <a class="btn" href="index.html#contact">Contact</a>
    </div>
  </nav>
</header>

<div class="wrap">
  <div class="page-head">
    <span class="kicker">Writing</span>
    <h1>Notes &amp; essays</h1>
    <p>Reflections on art, curating, and the city — updated whenever there's something worth writing down.</p>
  </div>

  <div class="feed" id="feed"></div>
</div>

<footer>
  <div class="wrap">
    <a href="index.html">← Back to verakorman.info</a>
  </div>
</footer>

<script src="posts.js"></script>
<script>
  const feed = document.getElementById('feed');

  if (!window.POSTS || POSTS.length === 0) {
    feed.innerHTML = '<p class="empty">Nothing published yet — check back soon.</p>';
  } else {
    feed.innerHTML = POSTS.map(post => `
      <article class="post">
        <span class="post-date">${post.date}</span>
        <h2>${post.title}</h2>
        ${post.image ? `<img src="${post.image}" alt="${post.title}">` : ''}
        <div class="post-body">${post.body}</div>
      </article>
    `).join('');
  }
</script>

</body>
</html>
