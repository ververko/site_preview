        <p style="font-style:italic; color:rgba(74,85,112,.8);">A visit to ADN Galeria in Barcelona, showing the new Eugenio Merino exhibition</p>

        <p>Barcelona's gallery world is one I am still trying to get to know and digest. We all arrive in cities carrying with us certain baggage and fantasies about the place. There were periods when most of my traveling around the world consisted mainly of history and art museums, with a little music thrown in. Madrid is associated in my mind with major museums and an international contemporary art scene; Berlin and New York are cities where art is almost a spoken language. Barcelona, by contrast, is often fixed in the collective imagination through figures such as Gaudí and Picasso, traditional festivals and, of course, football and the good life of a Mediterranean city.</p>

        <p>Since arriving in the city, I have devoted one day a week to wandering. I map galleries, museums, independent art spaces and cultural institutions. Often, during my gallery walks, I mostly observe, wander and allow the art to do its work. Only later, if something continues to occupy my thoughts after I have left the gallery, I begin to do more research. I open dozens of tabs. Writing, in this sense, is also my excuse for doing research. Once I decide to write, I take a plunge and start digging deeper.</p>

        <p>The more I get to know the local scene, the more I discover its uniqueness, the traditions from which it emerged, and the questions occupying the galleries, cultural institutions and artists working within it, both local and international. I hope these pieces will be the beginning of an attempt to map just one of the many possible routes through Barcelona's art world.</p>

        <p style="text-align:center; color:rgba(74,85,112,.4);">*</p>

        <p>A gallery that quickly became a favorite of mine is ADN Galeria, one of Barcelona's prominent contemporary art galleries. The gallery has a main space in the city and another in Sant Cugat, where, among other things, residency programs and rotating exhibitions take place. I have wanted to write about it for a long time, but only now have I found the right point of entry: Always Franco (Spain Brand), an exhibition by Spanish artist Eugenio Merino, curated by Halim Badawi, a Colombian curator who lives and works in Madrid.</p>

        <p>It is an impressive exhibition. It deals with Spain's past and it casts a long shadow all the way into the present. No less importantly, it offers a way of understanding something about the local art scene and the ways in which artists in Spain continue to grapple with questions of memory, political responsibility and the unresolved history of Francoism. I knew about the exhibition before it opened. I happened to visit the gallery unexpectedly, right in the middle of the installation. On my way out, they handed me a printed invitation like they used to in the old days to the upcoming exhibition. On the invitation was a stylized logo, white on red. You know, something like Coca-Cola, with the title above it: Always Franco. Spain Brand.</p>

        <p>The use of the branding of major American corporations is very familiar to me from artistic practices that employ the language of the corporation to critique capitalism, consumerism and structures of power. When I arrived at the opening with friends, my daughter and my partner, the sculpture was waiting for us in all its glory at the far end of the gallery's main entrance. This space is usually used for smaller exhibitions, and it also serves as the passageway to the small project space upstairs and to the main gallery.</p>

        <p>The sculpture, standing in a dim-lit area, is a vending machine refrigerator bearing the logo of a white wave against a red background. Inside it is a hyperrealistic figure of Francisco Franco, standing slightly crooked in order to fit the elongated refrigerator with its glass door, dressed in uniform and wearing his iconic sunglasses. His head is slightly oversized in relation to his body, reminiscent of a caricature. I was busy examining his features up close, studying every detail of the face of the murderous dictator, while my four-year-old daughter asked to have her picture taken with the funny/scary figure inside the refrigerator.</p>

        <img src="assets/writing/franco-fridge-full.jpg" alt="Eugenio Merino, Franco in a fridge, hyperrealistic sculpture of Francisco Franco inside a vending machine refrigerator">

        <p>Franco is not presented as dead. Quite the opposite: he is preserved, refrigerated, as though he has been taken off the shelf for a moment and will immediately be returned to it. In Spain, there is an ancient Catholic tradition of the dead body that continues to be present, to possess power and meaning. Whether it is the body of a saint or the body of a dictator, its physical presence in public space creates memory, authority and sometimes even adoration. The refrigerator does not symbolize his death but his preservation. It suggests a reading according to which, even after the transition to democracy, some of the power structures, elites and myths of the dictatorship never truly disappeared.</p>

        <p>The work was first exhibited at the ARCO art fair in 2012 and caused enormous public controversy. The Francisco Franco Foundation (FNFF) sued Merino, claiming that he had damaged the dictator's honor, but the artist won the case. In the wake of the lawsuit, a manifesto of support was published and signed by artists and cultural figures. The signatories pointed to the absurdity of a foundation dedicated to preserving the legacy of a dictator who suppressed freedom of expression, by using freedom of expression and the judicial system itself in an attempt to censor a critical work of art. For them, the very existence of the foundation and the public legitimacy it continues to enjoy demonstrate precisely Merino's point: Francoism is not merely a chapter in history, but a legacy that continues to exist within Spanish society.</p>

        <p>The work is now being exhibited again, ninety years after the 1936 military coup and fifty years after Franco's death. The exhibition's title has also expanded. Whereas it was previously simply called Always Franco, it now carries the additional title Spain Brand. Franco's figure has also changed. This time he is dressed in his white uniform as captain-general of the Spanish Navy, a choice the artist explains as a metaphor for the "whitewashing" of Francoism throughout decades of Spanish democracy. In retrospect, the current exhibition seems not merely to reconstruct the earlier work, but to respond to a world that has changed. As Merino said in one of the interviews conducted around the opening of the exhibition: "Not only did I win the lawsuit, but since then the far right has only grown stronger. And not just in Spain, but all over the world."</p>

        <p>For me, coming from Israel — a place whose reality is deeply charged with questions of the survival of democracy, the rise of the far right, the undermining of the judicial system and a continuing war — these things do not remain confined to Spanish history. I believe the same is true for foreign viewers from other places. They touch on questions confronting almost every democracy today: How do authoritarian regimes continue to exist even after they have fallen? How do images create memory? And how can visual culture turn even a dictator into a consumer product?</p>

        <p>The sculpture is the only work in that corridor, and it leads us toward another exhibition that opened at the same time, Curvatura (Curvature) by artist Laura Llaneli. We were a little disappointed. "Is that it? Is this the entire Merino exhibition?" But then we discovered that at the far end of the room there was a black curtain. Behind it, another space opened up, almost like a secret room, where a small dialogue takes place between the two exhibitions: additional works by Merino alongside works by Laura Llaneli. On the surface, there is no direct connection between them. Llaneli does not deal with Spain's historical memory or with Franco. Her exhibition examines sound not as something that is actually heard, but as memory, reverberation, absence and the possibility of listening. How do the background noises we ignore continue to shape our experience?</p>

        <p>I don't know whether this was the intentional curatorial move, but there was something poetically optimistic about it, an attempt to create a space that speaks about forms of resistance through art. Llaneli speaks about background noise and the possibility of listening to what can barely be heard. Merino speaks about Francoism in a similar way: not as a living regime, but as a political, social and cultural background noise that we may have grown accustomed to ignoring, yet which continues to reverberate beneath the surface. On one wall are additional works by Llaneli, photographs with texts and objects dealing with the politics of listening. Opposite them are Merino's works, redirecting our gaze toward the political power of the visual image.</p>

        <p style="text-align:center; color:rgba(74,85,112,.4);">*</p>

        <p>Merino, born in Madrid in 1975, has spent years working in the friction zones between belief and doubt, between respect and provocation, and between "taste" and "bad taste." He works primarily in neo-realist sculpture and installation, combining historical symbols with imagery from popular culture, the media and contemporary iconography. Through irony and visual metaphors, he connects worlds that appear impossible to reconcile. He invites us, the viewers, to reconsider what seems to be self-evident.</p>

        <p>One of the first works I encountered in the space was a shiny metal door handle, whose keyhole was designed in the shape of a swastika. The work is called The Gateway to Fascism. It is a work of simple form. Personally, I would have placed it on a wall by itself rather than alongside other works. It is only a door handle, but one cannot help asking where it leads. Turning the handle is the moment when we decide whether to enter or remain outside. Here, the passageway itself is shaped through one of the most loaded symbols of the twentieth century.</p>

        <p>In the text accompanying the work on the artist's website, Merino refers to the renewed rise of the neo-fascist right around the world. He draws on the work of historian Steven Forti, author of Extrema Derecha 2.0 (2021), which describes what he calls the "neo-fascist international" or the "reactionary international": a global network of movements and leaders who share political strategies, public language and a nationalist worldview. It is further argued that oligarchs from the technology world provide the digital infrastructure for spreading fascist ideas, thereby contributing to the erosion of democracy and the normalization of contemporary fascism. The work does not claim that every one of them is a Nazi, but rather uses the swastika as a broader symbol, pointing to the connections between a fascist past and new forms of authoritarianism. I stood in front of that door handle and could not help thinking about the viral video of Elon Musk raising his arm in a Nazi salute, that has generated an endless debate over the meaning of the gesture he made. Perhaps that is precisely the point: we live in an age in which a single image can generate countless interpretations, deny its own meaning, spread at dizzying speed and become part of public discourse long before its meaning can be established.</p>

        <img src="assets/writing/franco-shoval-victory.jpg" alt="Eugenio Merino, Shoval, a shovel topped with a carved wooden hand making a victory sign">
        <img src="assets/writing/franco-juan-carlos.jpg" alt="Eugenio Merino, King Juan Carlos I, a realistic head inside a cardboard box">

        <p>The art in this exhibition does not provide answers, but creates a bodily understanding of the power of the image. It underlines the enormous power of visual imagery in the age of social media. Quicker than text, volatile, widely accessible. Two more works await farther on. Another realistic head inside a box, that of King Juan Carlos I, father of the current king of Spain, the man who came to power after Franco's death and is associated with Spain's transition to democracy, but whose critics argue he never unequivocally condemned the crimes of Francoism.</p>

        <p>It is as though Merino is pointing to the strategy that made the transition to democracy possible: a reconciliation built on the silencing and whitewashing of the regime's crimes, allowing the country to move forward without undermining its foundations. And another work, perhaps the one I found most intriguing: a shovel topped with a carved wooden hand making a V sign for victory. For a moment I stood in front of it, wondering whether I was reading the work correctly, but the longer I looked at it, the sharper its message seemed. The shovel is replacing victory. The mass graves, the disappearances, the violence and the deaths are not merely historical memory; they become part of the narrative of the winners who ended up writing history.</p>

        <p>In a brief conversation with the gallerist, he remarked that many people still speak of the Spanish Civil War, but in his view it was genocide. This idea stuck with me. For him, and for many people in Spain, this is not merely a question of terminology. The term "Civil War" obscures the fact that even if what took place was a military coup against an elected government, it led to prolonged repression and widespread crimes against the people of Spain as a whole. Even if the historical debate is more complex than this stark formulation, the sensitivity surrounding the words reveals just how much the past is still here.</p>

        <p>Perhaps that is why this exhibition stayed with me for so long after I left the gallery, because it reminded me once again of the power of art. It points toward what we would rather not see.</p>

        <p>If you visit ADN Galeria, don't settle for a quick glance at the main work. It is worth standing for a moment in front of the refrigerator and moving closer to Franco's face. Look at the crooked angle of his mouth, the way it opens slightly, as though savoring the confidence of a man who was certain history belonged to him.</p>

        <p style="font-style:italic; color:rgba(74,85,112,.7); font-size:15px;">Always Franco / Spain Brand — Galeria ADN, Barcelona. Until August 13. Originally published on Hapuente Magazine.</p>
      `
    },

        <p style="font-style:italic; color:rgba(74,85,112,.8);">The major Pan-Africa exhibition at MACBA</p>

        <p>I have a special fondness for MACBA, perhaps because it never quite feels like a museum trying to detach itself from the city. Even before you step inside, the square in front of it is already alive: skaters, people sitting on the ground, kids sliding along the railings, black marks scored into the walls. A living space, unframed.</p>

        <p>The building itself, a white modernist structure with sharp, slanted lines, sits in the heart of the Raval, among older buildings — some preserved and turned into museums, some abandoned, and some simply the loud, crowded Raval itself, full of life. The white façade, born from a modernist architectural ideal with a distinct political and historical charge, isn't kept pristine. It gets scratched, dirtied, absorbs marks. This is a white that wears down, not a white that's sanctified.</p>

        <p>The feeling continues inside. At the entrance areas, at the information desks, there's no excess formality. The guards and staff speak at eye level, sometimes trading a personal word, sometimes a joke. The museum doesn't present itself as a sterile or elevated space, but as one in constant contact — not always comfortable — with whoever walks in. I remember my first months in Barcelona, wandering around alone with my young daughter, and she just wants to touch everything. The guard winks at her and says it's fine, just a little. What comfort there was in that, what a fleeting kinship between ordinary people in the face of art's sanctity — she, too, perhaps an immigrant, perhaps a student on a long shift.</p>

        <p>Over the years, MACBA has held a consistent tension: between major names from the international field and artists working out of local context; between historical research and a living political stance. Not always, not in every exhibition, but often enough a clear spirit comes through. You could call it a Catalan spirit — not as nationalism but as a cultural position: skepticism toward centers, sensitivity to suppressed histories, and a willingness to make room for discomfort.</p>

        <h3>Project a Black Planet: The Art and Culture of Panafrica</h3>

        <p>And now, when visiting a contemporary museum has already become routine, I came to see the exhibitions that close one year and open the next. Usually this is an interesting, thought-provoking experience, but this time, in the museum's flagship show, something entirely different awaited me — something powerful and especially unsettling.</p>

        <p>Project a Black Planet: The Art and Culture of Panafrica is the first major international exhibition to examine the cultural expressions of Pan-Africanism from the early 20th century to today. This is not a local exhibition, nor one meant simply to "present a topic." It's an ambitious attempt to map a cultural, political, and artistic movement across more than a century, from the first Pan-African Congress in 1919 to the present. An attempt that seeks not only to present history, but to challenge how history is written, collected, and displayed — and in that sense, it operates right at the heart of the museum's spirit.</p>

        <p>The exhibition was co-curated by chief curator Elvira Dyangani Ose, director of MACBA, together with curators Antawan Byrd, Adom Getachew, and Matthew S. Witkovsky. The project was developed in partnership with the Art Institute of Chicago, the Barbican Centre in London, and KANAL – Centre Pompidou in Brussels, and will travel between the four institutions through spring 2027.</p>

        <img src="assets/writing/panafrica-masks-installation.jpg" alt="Installation view of masks and sculptures at Project a Black Planet, MACBA">

        <h3>A Space That Demands Time</h3>

        <p>The exhibition presents Pan-Africa as an imagined space that exceeds national borders, where art and culture serve as tools for reckoning with the legacy of colonialism and for imagining a shared, just future. It includes roughly 500 works by around 100 artists from Africa and its diasporas, bringing together a wide range of mediums and formats in an equal dialogue, without hierarchies of place, time, or genre.</p>

        <p>The exhibition asks a lot, in both words and images. Not a confusing overload, but an abundance: a richness that refuses to settle into a single reading. I read one wall text out of several, but quickly moved on to just looking. Where do you even begin with something like this? I tried to understand what I was seeing, in what context it was made, and how it all holds together.</p>

        <p>It was already clear this wasn't just another impressive exhibition, but a singular case that refuses to close once you leave the space. Even its placement, on the second floor, in the large central hall, is a statement. A few weeks later I went back for a guided tour — not to "understand it all," but to hear how the thing is said out loud. The tour didn't close the experience; it deepened it.</p>

        <h3>Three Spaces, Three Movements</h3>

        <p>The curators don't offer a chronological route, but they do offer a way to walk it. The eye is guided through thematic spaces that organize the experience from within. The exhibition works as three main areas, each opening onto sub-spaces, moving gently between history, symbols, and personal experience.</p>

        <h3>The First Space: History as Mechanism</h3>

        <p>The first space is also the more historical one. It deals with the colonization of Africa, and above all with how it was explained, justified, and disseminated through Western systems of knowledge: maps, archives, photographs, ethnographic representations, philosophical texts. Here it becomes clear that "Africa" is not only a place but an idea — an image built as a kind of colonial library, presenting the continent as an empty space that could be filled, managed, and controlled.</p>

        <p>Western philosophers, Hegel among them, argued that Africa had no history. That claim produced a primitivist image, and the divide it drew between "traditional" and "modern" continues to be reproduced today. But the exhibition doesn't stop there: it points to the moment when this knowledge was reclaimed by Africans and their descendants — not to adopt it, but to turn it on its head and open other paths for thinking about identity, liberation, and Pan-African solidarity.</p>

        <p>Already at the entrance to the space, stability is unsettled. Contemporary artworks are placed alongside archival material and historical photographs, and the space is cut through with shelves holding sculptures that look like archaeological finds — but are, in fact, contemporary works. The boundaries between past and present blur, between museum object and living thing, opening the question of how history gets packaged as knowledge, and who gets included in it.</p>

        <p>Among the sequence of works, Ingrid Mwangi and Robert Hutter's <em>Static Drift</em> (2010) stands out. On the skin of Mwangi's body, maps of Germany and of Africa were burned in, appearing like birthmarks. Over Germany the words "burn out country" appear; over Africa, "bright dark continent." The body becomes a surface onto which histories of power, belonging, and exploitation are inscribed.</p>

        <p>Another work, quiet and minimal, is John Stollmeyer's <em>A Caribbean Basin</em> (1982): a rusted metal bowl, perforated with the outlines of Cuba, Grenada, and Nicaragua — three countries that underwent socialist revolutions that stirred broad regional hope, but also led to boycott and economic exclusion by the United States. The simple, damaged material holds a quiet but precise protest. These are just a few points of contact within a broad, dense sequence of works and materials that fill the space.</p>

        <img src="assets/writing/panafrica-static-drift.jpg" alt="Static Drift by Ingrid Mwangi and Robert Hutter, two photographs of a torso with continent-shaped markings">

        <h3>The Second Space: Flag, Journey, Future</h3>

        <p>Entering the second space, more colorful and vibrant, it becomes immediately clear that this is a space concerned with the Pan-African idea and with the flag as a central symbol. The Pan-African flag — red, black, and green — recurs here again and again: red marking shared blood, black the community and its right to sovereignty and self-determination, and green the fertile soil of Africa. Unlike national flags, this is a portable flag, a symbol of solidarity crossing state borders, and one that also recalls the violence by which those borders were drawn.</p>

        <p>In this space the flag is not only a symbol but a starting point for rethinking. Working from a critique of Western conceptions of time, the works turn toward myths, journeys, and imagined futures, sometimes reaching even beyond planet Earth. The video works offer possible articulations of the future: visions of a Pan-African utopia, at once speculative and political.</p>

        <p>Other works extend the discourse to queer activisms as well, offering a conception of belonging, interdependence, and shared humanity.</p>

        <img src="assets/writing/panafrica-rubber-sculpture.jpg" alt="Sculpture made of stitched black rubber inner tubes, installed in the gallery">
        <img src="assets/writing/panafrica-kanga-textiles.jpg" alt="Wall of printed Pan-African kanga textiles in red, black, yellow and green">

        <h3>The Final Space: Multiplicity, Discomfort, Identity</h3>

        <p>This is the exhibition's final space, and also its most expansive and dense. A central space from which small spaces branch off, sub-spaces with different themes, all tied to one broad and especially personal theme. It is also the largest space, and the most subjective and difficult to absorb.</p>

        <p>Dozens of works, a multiplicity of voices and mediums. A visual and conceptual celebration featuring works by major artists including Marlene Dumas, Chris Ofili, Kerry James Marshall, and Samuel Fosso. In his iconic work, Fosso embodies an African "chief" figure, a play on identity that critiques African elites who collaborated with colonialism, through an image that is ostentatious, ironic, and painful. Alongside these works unfolds a broad sequence of personal, bodily, and political responses to the question of what blackness is and what it means to be Black — a sequence that emphasizes multiplicity rather than uniformity, leaving the viewer in an ongoing state of questioning and thought.</p>

        <p>At the center of the space sit two open pavilions, islands of gathering. You can sit, listen, watch, and look through archival materials: personal stories, recordings, magazines, books, and research. Together they emphasize that Blackness is not a fixed identity or a single essence, but a fluid, dynamic concept — one shaped by history, but also by lived, subjective experience.</p>

        <p>Among the dozens of works, a small, almost hidden painting catches the eye. At first glance it seems familiar, Western-expressionist. I move closer, and its power becomes clear immediately. This is <em>Agony</em> by Colette Omogbai, one of the pioneers of postcolonial modernism in Nigeria. A fragmented, contorted body, intense color against a dark, dense background. It's a powerful work that points sharply to the way African art profoundly influenced modern Western art — an influence that has often been erased or absorbed into the official story of art history.</p>

        <p>And finally, through a work by a white, international artist, the exhibition returns to its core question. Marlene Dumas's painting <em>Albino</em> depicts a Black African person with albinism. The enigmatic gaze and the ghostly skin tone, against a deep, dark background, produce a sense of isolation and alienation. It's a painting that carries a broad discussion of the body as a generator of identity, and of how art can unsettle racial distinctions without offering an easy resolution.</p>

        <p>The choice to place this painting on a central wall doesn't close the exhibition, but leaves it open: a complex, critical, multivocal discussion that doesn't converge on a single statement. An exhibition that asks the viewer to stay, to get entangled, and to hold discomfort as a position.</p>

        <p>So yes, go see it. Give yourself time, and maybe even more than one visit. The exhibition is on view at MACBA, and on Saturday afternoons admission is free — a rare invitation to meet an exhibition that isn't in a hurry to let you go.</p>
